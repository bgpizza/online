<body>
<header class="topbar">
  <a class="master-link" href="index.html">← Menu</a>
  <div class="brand"><div class="logo"><img src="assets/logo.png" alt="Bake & Grill logo"></div><div><b>Bake & Grill</b><small>ORDER TRACKING</small></div></div>
  <a class="track-link" href="master.html">⚙️ Master</a>
</header>
<section class="standalone-track track-page">
  <div class="track-box">
    <span class="pill">📦 ORDER TRACKING</span>
    <h1>Check Your Order Status</h1>
    <p>Your latest order on this device will be tracked automatically. No Order ID needed.</p>
    <div class="track-row"><button id="trackLive" class="primary">🔄 Refresh My Order Status</button></div>
    <div id="liveStatus" class="checkout-location"></div>
    <div id="customerReviewPrompt" class="bg-customer-review-slot"></div>
    <button id="enableNotifications" class="push-enable-btn" type="button">🔔 Get Order Updates on This Phone</button>
    <p class="push-help-text" id="pushHelpText">Enter your Order ID, check its status, then tap this button and choose Allow.</p>
  </div>
</section>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-messaging-compat.js"></script>
<script src="firebase-config.js?v=20261119-appcheck-enterprise-diag-v2"></script>
<script src="firebase-init.js?v=20261119-appcheck-enterprise-diag-v2"></script>
<script src="customer-reviews.js?v=20261119-security-client-v3"></script>
<script>
let unsub=null, orderUnsub=null, previousTrackedStatus=null, previousTrackedOrderId="";
const steps=['NEW','ACCEPTED','PREPARING','READY','OUT FOR DELIVERY','DELIVERED'];
const labels={NEW:'Waiting for restaurant',ACCEPTED:'Order accepted',PREPARING:'Being prepared',READY:'Ready for pickup','OUT FOR DELIVERY':'Out for delivery',DELIVERED:'Delivered',CANCELLED:'Restaurant not accepting orders'};
function $(s){return document.querySelector(s)}
function showStatus(s,data={},id=''){
  const el=$('#liveStatus');
  if(s==='CANCELLED'){
    el.innerHTML='<div class="track-cancel"><div class="track-status-icon">⛔</div><strong>Restaurant not accepting orders right now</strong><p>This order was not accepted in time. Please try again later.</p></div>';
    $('#customerReviewPrompt').innerHTML='';return;
  }
  const idx=Math.max(0,steps.indexOf(s));
  el.innerHTML='<div class="track-status-top"><div><small>ORDER STATUS</small><strong>'+labels[s]+'</strong></div><span class="track-live-dot">● LIVE</span></div><div class="track-timeline">'+steps.map((x,i)=>'<div class="track-step '+(i<=idx?'done ':'')+(i===idx?'current':'')+'"><span>'+(i<idx?'✓':i===idx?'●':'')+'</span><b>'+labels[x]+'</b></div>').join('')+'</div>';
  if(window.BGReviews)window.BGReviews.render($('#customerReviewPrompt'),id,s,db);
}
function renderTrackedSnapshot(data,id,source){
  const status=String(data?.status||'UNKNOWN').toUpperCase();
  if(previousTrackedStatus!==null&&previousTrackedStatus!==status)window.showCustomerOrderStatusPopup?.(status,id);
  previousTrackedStatus=status;
  if(status==='DELIVERED')localStorage.setItem('bakeGrillLastDeliveredOrder',id);
  showStatus(status,data,id);
  const note=document.getElementById('trackSourceNote');
  if(note)note.textContent=source==='public'?'Live tracking connected':'Live status connected from your secure order record';
  if(status==='DELIVERED')localStorage.removeItem('bakeGrillActiveOrder');
}
async function check(){
  const params=new URLSearchParams(location.search);
  const id=String(params.get('order')||localStorage.getItem('bakeGrillActiveOrder')||localStorage.getItem('bakeGrillLastDeliveredOrder')||'').trim().toUpperCase();
  if(!id){$('#liveStatus').textContent='No recent order found on this device. Place an order here first to track it automatically.';return;}
  if(typeof firebaseReady==='undefined'||!firebaseReady){$('#liveStatus').textContent='Firebase is not configured.';return;}
  try{await window.customerAuthReady;}catch(e){console.warn('Customer session restore:',e);}
  if(!window.auth?.currentUser?.phoneNumber){
    $('#liveStatus').innerHTML='Please sign in with your verified mobile number on Bake &amp; Grill, then <a href="index.html">return to your order page</a>.';
    return;
  }
  unsub?.();orderUnsub?.();
  if(previousTrackedOrderId!==id){previousTrackedOrderId=id;previousTrackedStatus=null;}
  $('#liveStatus').textContent='Connecting to your live order…';
  let publicReady=false,publicExists=false,publicData=null,privateOrder=null,publicFailed=false;
  const renderBest=()=>{
    if(publicExists&&publicData){renderTrackedSnapshot(publicData,id,'public');return;}
    if(privateOrder){renderTrackedSnapshot(privateOrder,id,'private');return;}
    if(publicFailed)$('#liveStatus').textContent='Could not connect to order tracking. Check your connection and try Refresh.';
  };
  unsub=db.collection('publicStatuses').doc(id).onSnapshot(snapshot=>{
    publicReady=true;publicExists=snapshot.exists;publicData=snapshot.exists?(snapshot.data()||{}):null;
    renderBest();
    if(!snapshot.exists&&!privateOrder)$('#liveStatus').textContent='Connecting to your order record…';
  },error=>{
    console.error('Public status listener failed:',error);publicFailed=true;renderBest();
  });
  orderUnsub=db.collection('orders').doc(id).onSnapshot(snapshot=>{
    privateOrder=snapshot.exists?(snapshot.data()||{}):null;
    if(privateOrder&&!publicExists)renderBest();
    else if(!privateOrder&&!publicExists&&publicReady)$('#liveStatus').textContent='Your recent order could not be found. Please contact Bake &amp; Grill if you need help.';
  },error=>{
    console.warn('Private order tracking fallback unavailable:',error);
    if(!publicExists&&!privateOrder)$('#liveStatus').textContent='Order tracking is unavailable on this device. Please return to the main website and sign in with your verified number.';
  });
}
$('#trackLive').onclick=check;
setTimeout(check,500);
</script>
<script src="pwa.js?v=20261120-phase4-app-polish-v1"></script>
<script src="notifications.js?v=20261120-track-master-push-sync-v2"></script>
