<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e51b23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta name="theme-color" content="#e51b23">
<title>Bake & Grill — Track Order</title>
<link rel="stylesheet" href="styles.css?v=20261116-v30">
</head>
<body>
<header class="topbar">
  <a class="master-link" href="index.html">← Menu</a>
  <div class="brand"><div class="logo"><img src="assets/logo.png" alt="Bake & Grill logo"></div><div><b>Bake & Grill</b><small>ORDER TRACKING</small></div></div>
  <a class="track-link" href="master.html">⚙️ Master</a>
</header>
<section class="standalone-track track-page">
  <div class="track-box">
    <span class="pill">📦 ORDER TRACKING</span>
    <h1>Check Your Order Status</h1>
    <p>Your latest order on this device will be tracked automatically. No Order ID needed.</p>
    <div class="track-row"><button id="trackLive" class="primary">🔄 Refresh My Order Status</button></div>
    <div id="liveStatus" class="checkout-location"></div>
    <button id="enableNotifications" class="push-enable-btn" type="button">🔔 Get Order Updates on This Phone</button>
    <p class="push-help-text" id="pushHelpText">Enter your Order ID, check its status, then tap this button and choose Allow.</p>
  </div>
</section>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-messaging-compat.js"></script>
<script src="firebase-config.js?v=20261116-v30"></script>
<script src="firebase-init.js?v=20261116-v30"></script>
<script>
let unsub=null;
const steps=['NEW','ACCEPTED','PREPARING','READY','OUT FOR DELIVERY','DELIVERED'];
const labels={NEW:'Waiting for restaurant',ACCEPTED:'Order accepted',PREPARING:'Being prepared',READY:'Ready for pickup','OUT FOR DELIVERY':'Out for delivery',DELIVERED:'Delivered',CANCELLED:'Restaurant not accepting orders'};
function $(s){return document.querySelector(s)}
function showStatus(s){const el=$('#liveStatus');if(s==='CANCELLED'){el.innerHTML='<div class="track-cancel"><div class="track-status-icon">⛔</div><strong>Restaurant not accepting orders right now</strong><p>This order was not accepted in time. Please try again later.</p></div>';return;}const idx=Math.max(0,steps.indexOf(s));el.innerHTML=`<div class="track-status-top"><div><small>ORDER STATUS</small><strong>${labels[s]||s}</strong></div><span class="track-live-dot">● LIVE</span></div><div class="track-timeline">${steps.map((x,i)=>`<div class="track-step ${i<=idx?'done':''} ${i===idx?'current':''}"><span>${i<idx?'✓':i===idx?'●':''}</span><b>${labels[x]}</b></div>`).join('')}</div>`;}
function check(){const id=String(localStorage.getItem('bakeGrillActiveOrder')||'').trim().toUpperCase();if(!id){$('#liveStatus').textContent='No recent order found on this device. Place an order here first to track it automatically.';return}if(typeof firebaseReady==='undefined'||!firebaseReady){$('#liveStatus').textContent='Firebase is not configured.';return}unsub?.();$('#liveStatus').textContent='Connecting to your latest order…';unsub=db.collection('publicStatuses').doc(id).onSnapshot(d=>{if(!d.exists){$('#liveStatus').textContent='Your recent order could not be found.';return}showStatus(d.data().status||'UNKNOWN');},e=>{$('#liveStatus').textContent='Could not check status.';console.error(e);});}
$('#trackLive').onclick=check;
setTimeout(check,500);
</script>
<script src="pwa.js"></script>
<script src="notifications.js?v=20261116-push-v30-no-startup-popup"></script>
</body></html>
