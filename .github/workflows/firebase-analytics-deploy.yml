name: Deploy Master Analytics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-analytics-deploy.yml"
      - "functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-grill-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAKE_GRILL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ensure Analytics Data API is enabled
        run: |
          if [[ "$(gcloud services list --enabled --project bake-grill --filter='config.name=analyticsdata.googleapis.com' --format='value(config.name)')" != "analyticsdata.googleapis.com" ]]; then
            gcloud services enable analyticsdata.googleapis.com --project bake-grill --quiet
          fi
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy analytics callable
        run: firebase deploy --only functions:masterAnalyticsV1 --project bake-grill --non-interactive --force
      - name: Verify analytics runtime identity
        run: gcloud functions describe masterAnalyticsV1 --gen2 --region us-central1 --project bake-grill --format='value(serviceConfig.serviceAccountEmail)'
