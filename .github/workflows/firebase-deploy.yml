name: Deploy Firebase (Bake & Grill)

on:
  push:
    branches:
      - main
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "functions/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-grill-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore Rules and Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Functions dependencies
        run: npm install --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAKE_GRILL }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore Rules and Cloud Functions
        run: firebase deploy --only firestore:rules,functions:notifyMasterNewOrderV2,functions:notifyOrderStatus,functions:autoCancelUnacceptedOrders --project bake-grill --non-interactive --force
